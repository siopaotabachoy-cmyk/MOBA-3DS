name: Build Lane Rush

on:
  push:
  workflow_dispatch:

# lets the build create releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build 3dsx
        run: make

      - name: Upload 3dsx
        uses: actions/upload-artifact@v4
        with:
          name: LaneRush-3dsx
          path: LaneRush.3dsx
          if-no-files-found: error

      - name: Install makerom
        run: |
          apt-get update
          apt-get install -y curl unzip
          curl -fL -o /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18/makerom-v0.18-ubuntu_x86_64.zip
          unzip /tmp/makerom.zip makerom -d /usr/local/bin
          chmod +x /usr/local/bin/makerom

      - name: Build cia
        run: make cia

      - name: Upload cia
        uses: actions/upload-artifact@v4
        with:
          name: LaneRush-cia
          path: LaneRush.cia
          if-no-files-found: error

      - name: Make QR code
        run: |
          apt-get install -y qrencode
          qrencode -s 8 -m 4 -o LaneRush-qr.png "${{ github.server_url }}/${{ github.repository }}/releases/download/build-${{ github.run_number }}/LaneRush.cia"

      - name: Create release
        if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Lane Rush build ${{ github.run_number }}
          body: |
            Scan with FBI (Remote Install, then Scan QR Code) to install the .cia:

            ![QR code](${{ github.server_url }}/${{ github.repository }}/releases/download/build-${{ github.run_number }}/LaneRush-qr.png)
          files: |
            LaneRush-qr.png
            LaneRush.3dsx
            LaneRush.cia
          fail_on_unmatched_files: true
          make_latest: true
