name: Build Lane Rush

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build 3dsx
        run: make

      - name: Upload 3dsx
        uses: actions/upload-artifact@v4
        with:
          name: LaneRush-3dsx
          path: LaneRush.3dsx
          if-no-files-found: error

      - name: Install makerom
        run: |
          apt-get update
          apt-get install -y curl unzip
          curl -fL -o /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18/makerom-v0.18-ubuntu_x86_64.zip
          unzip /tmp/makerom.zip makerom -d /usr/local/bin
          chmod +x /usr/local/bin/makerom

      - name: Build cia
        run: make cia

      - name: Upload cia
        uses: actions/upload-artifact@v4
        with:
          name: LaneRush-cia
          path: LaneRush.cia
          if-no-files-found: error
